<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="jarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="50%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner glow border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.4" />

  <!-- Center Water Jar & Droplet Graphic -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Water Bottle Cap & Neck -->
    <rect x="-34" y="-170" width="68" height="24" rx="6" fill="#f8fafc" />
    <rect x="-24" y="-146" width="48" height="28" fill="#e2e8f0" />
    
    <!-- Bottle Shoulder & Main Body -->
    <path d="M -24 -118 C -70 -110, -110 -60, -110 0 L -110 110 C -110 145, -75 160, 0 160 C 75 160, 110 145, 110 110 L 110 0 C 110 -60, 70 -110, 24 -118 Z" 
          fill="url(#jarGrad)" />

    <!-- Bottle Ribs / Indentations -->
    <path d="M -96 -20 L 96 -20" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" stroke-opacity="0.6" />
    <path d="M -96 35 L 96 35" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" stroke-opacity="0.6" />
    <path d="M -96 90 L 96 90" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" stroke-opacity="0.6" />

    <!-- Center Droplet Motif inside Jar -->
    <path d="M 0 -60 C 30 0, 48 30, 48 55 C 48 82, 26 102, 0 102 C -26 102, -48 82, -48 55 C -48 30, -30 0, 0 -60 Z" 
          fill="url(#waterGrad)" />
    
    <!-- Droplet Glint / Reflection -->
    <path d="M -16 45 C -16 35, -5 20, 0 10 C -10 25, -24 45, -12 68 C -15 62, -16 54, -16 45 Z" 
          fill="#ffffff" opacity="0.75" />
  </g>
</svg>
